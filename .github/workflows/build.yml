name: Собрать APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Сборка
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Загрузить APK в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: Yuki-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Опубликовать в Releases (ссылка для телефона)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Yuki.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Yuki.apk --title "Юки — свежая сборка" --notes "Сборка из коммита ${GITHUB_SHA::7}. Скачай Yuki.apk и установи."
